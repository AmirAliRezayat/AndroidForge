name: Build Juggle APK
on:
  push:
    paths: ['juggle/**', '.github/workflows/build-juggle.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --no-daemon :android:assembleDebug
        working-directory: juggle
      - uses: actions/upload-artifact@v4
        with:
          name: Juggle-debug-apk
          path: juggle/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: juggle-v1.0.0-build-${{ github.run_number }}
          name: Juggle v1.0.0 build ${{ github.run_number }}
          files: juggle/android/build/outputs/apk/debug/*.apk
          prerelease: true
        env: {GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}}
